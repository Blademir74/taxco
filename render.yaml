services:
  - type: web
    name: campo-recoleccion-api
    runtime: python
    rootDir: dashboard/campo_recoleccion/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"